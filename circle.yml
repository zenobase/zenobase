machine:
  java:
    version: oraclejdk8

dependencies:
  post:
    - sudo pip install --upgrade awscli

test:
  override:
    - play 'test-only *Test'

deployment:
  production:
    branch: master
    commands:
      - play universal:package-zip-tarball
      - aws s3 cp target/universal/zenobase-SNAPSHOT.tgz s3://zeno-builds/zenobase-$CIRCLE_BUILD_NUM.tgz
