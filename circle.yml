general:
  branches:
    only:
      - master
  artifacts:
    - "target/universal/zenobase-SNAPSHOT.zip"

dependencies:
  post:
    - sudo pip install --upgrade awscli

test:
  override:
    - play dist

deployment:
  production:
    branch: master
    commands:
      - aws s3 cp target/universal/zenobase-SNAPSHOT.zip s3://zeno-app/
