machine:
  java:
    version: openjdk8

dependencies:
  override:
    - sbt update

test:
  override:
    - sbt 'test-only *Test'

deployment:
  production:
    branch: master
    commands:
      - sbt universal:package-zip-tarball
      - aws s3 cp target/universal/zenobase-SNAPSHOT.tgz s3://zeno-builds/zenobase-$CIRCLE_BUILD_NUM.tgz
