services:
  opensearch:
    image: opensearchproject/opensearch:3.3.0
    ports:
      - "9200:9200"
    volumes:
      - ../data/opensearch:/usr/share/opensearch/data
      - ../data/snapshots:/usr/share/opensearch/data/snapshots
    environment:
      - discovery.type=single-node
      - path.repo=/usr/share/opensearch/data/snapshots
      - OPENSEARCH_JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    healthcheck:
      test: curl -f http://localhost:9200/_cluster/health || exit 1
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 1g
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
      memlock:
        soft: -1
        hard: -1

  play:
    image: zenobase-play:latest
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/play/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./play/config/play.conf:/etc/play/prod.conf:ro
      - ./play/config/logback-play.xml:/etc/play/logback.xml:ro
      - ./play/config/enableLegacyTLS.security:/etc/play/enableLegacyTLS.security:ro
      - ../conf/local.conf:/etc/play/local.conf:ro
    mem_limit: 1g
    environment:
      - OPENSEARCH_SNAPSHOT_BUCKET=
    depends_on:
      opensearch:
        condition: service_healthy
