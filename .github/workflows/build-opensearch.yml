name: Build and Push OpenSearch

on:
  push:
    branches: [master]
    paths:
      - 'docker/docker-compose.yml'
      - 'docker/opensearch/**'
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push OpenSearch image
        uses: docker/build-push-action@v6
        with:
          context: docker/opensearch
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/zenobase-elasticsearch:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/zenobase-elasticsearch:${{ inputs.image-tag || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
