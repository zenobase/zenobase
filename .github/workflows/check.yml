name: Check

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    pull_request:
        branches: [main]
        paths:
            - ".github/workflows/check.yml"
            - "docker/**"
            - "src/**"
            - "!src/main/java/com/zenobase/scripts/**"
            - "pom.xml"

jobs:
    check:
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        steps:
            # Pull the image OpenSearchTestSupport starts while Maven builds and runs unit tests
            - name: Pre-pull OpenSearch image
              run: docker pull -q opensearchproject/opensearch:3.7.0 > /dev/null 2>&1 &

            - uses: actions/checkout@v7

            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 25
                  cache: maven

            - name: Check formatting and test
              run: ./mvnw -B spotless:check verify

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: target/site/jacoco/jacoco.xml
                  flags: backend
