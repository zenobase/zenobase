name: Build

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [main]
        paths:
            - "docker/**"
            - "src/**"
            - "!src/main/java/com/zenobase/scripts/**"
            - "pom.xml"
    workflow_dispatch:

env:
    AWS_REGION: us-east-1

jobs:
    build-and-push:
        runs-on: ubuntu-24.04-arm
        permissions:
            id-token: write
            contents: read
        services:
            opensearch:
                image: opensearchproject/opensearch:3.7.0
                ports:
                    - 9200:9200
                env:
                    discovery.type: single-node
                    plugins.security.disabled: "true"
                    DISABLE_INSTALL_DEMO_CONFIG: "true"
                options: >-
                    --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
                    --health-start-period 30s
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 25
                  cache: maven

            - name: Check formatting
              run: ./mvnw -B spotless:check

            - name: Test
              run: ./mvnw -B verify

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: target/site/jacoco/jacoco.xml
                  flags: backend

            - name: Package
              run: ./mvnw -B package -DskipTests

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2.1.7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.4.1

            - name: Build and push image
              uses: docker/build-push-action@v7.4.0
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/arm64
                  push: true
                  tags: |
                      ${{ steps.ecr-login.outputs.registry }}/zenobase-api:${{ github.sha }}
                      ${{ steps.ecr-login.outputs.registry }}/zenobase-api:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Create Sentry release
              run: |
                  npx @sentry/cli releases new "${{ github.sha }}"
                  npx @sentry/cli releases set-commits "${{ github.sha }}" --auto
                  npx @sentry/cli releases finalize "${{ github.sha }}"
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: zenobase
                  SENTRY_PROJECT: zenobase-api
