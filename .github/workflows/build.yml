name: Build

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [main]
        paths:
            - "docker/**"
            - "src/**"
            - "!src/main/java/com/zenobase/scripts/**"
            - "pom.xml"
    workflow_dispatch:

env:
    AWS_REGION: us-east-1

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        services:
            opensearch:
                image: opensearchproject/opensearch:3.3.0
                ports:
                    - 9200:9200
                env:
                    discovery.type: single-node
                    plugins.security.disabled: "true"
                    DISABLE_INSTALL_DEMO_CONFIG: "true"
                options: >-
                    --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
                    --health-start-period 30s
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: maven

            - name: Check formatting
              run: ./mvnw -B spotless:check

            - name: Test
              run: ./mvnw -B verify

            - name: Package
              run: ./mvnw -B package -DskipTests

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Build and push image
              uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/arm64
                  push: true
                  tags: |
                      ${{ steps.ecr-login.outputs.registry }}/zenobase-api:${{ github.sha }}
                      ${{ steps.ecr-login.outputs.registry }}/zenobase-api:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Create Sentry release
              run: |
                  npx @sentry/cli releases new "${{ github.sha }}"
                  npx @sentry/cli releases set-commits "${{ github.sha }}" --auto
                  npx @sentry/cli releases finalize "${{ github.sha }}"
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: zenobase
                  SENTRY_PROJECT: zenobase-api
