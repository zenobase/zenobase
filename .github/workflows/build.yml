name: Build and Push

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
      tag-latest:
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Play image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/play/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/zenobase-play:${{ inputs.image-tag }}
            ${{ inputs.tag-latest && format('{0}/zenobase-play:latest', steps.ecr-login.outputs.registry) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ES image
        uses: docker/build-push-action@v6
        with:
          context: docker/elasticsearch
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/zenobase-elasticsearch:${{ inputs.image-tag }}
            ${{ inputs.tag-latest && format('{0}/zenobase-elasticsearch:latest', steps.ecr-login.outputs.registry) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
