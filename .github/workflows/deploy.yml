name: Deploy

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: us-east-1

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Check image exists in ECR
              env:
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  found=$(aws ecr batch-get-image \
                      --repository-name zenobase-api \
                      --image-ids imageTag="$IMAGE_TAG" \
                      --query 'images[0].imageId.imageTag' \
                      --output text)
                  if [ "$found" != "$IMAGE_TAG" ]; then
                      echo "::error::No zenobase-api image tagged $IMAGE_TAG in ECR - build workflow may not have run for this commit"
                      exit 1
                  fi

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  package_json_file: infra/package.json

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  cache-dependency-path: infra/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: infra

            - name: Cache Pulumi plugins
              uses: actions/cache@v6
              with:
                  path: ~/.pulumi/plugins
                  key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('infra/pnpm-lock.yaml') }}
                  restore-keys: |
                      pulumi-plugins-${{ runner.os }}-

            - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
              env:
                  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
              with:
                  command: up
                  suppress-progress: true
                  comment-on-summary: true
                  stack-name: prod
                  work-dir: infra
                  config-map: |
                      zenobase:imageTag:
                        value: ${{ github.sha }}
