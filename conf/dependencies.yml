# Application dependencies

require:
    - play
    - play -> guice 1.2
    - com.google.guava -> guava 11.0.1:
        transitive: false
    - org.elasticsearch -> elasticsearch 0.19.0.RC2
    - org.codehaus.jackson -> jackson-core-asl 1.9.4
    - org.codehaus.jackson -> jackson-mapper-asl 1.9.4
    - com.ocpsoft -> ocpsoft-pretty-time 1.0.7:
        transitive: false

repositories:
    - sonatype:
        type: iBiblio
        root: "http://oss.sonatype.org/content/repositories/releases"
        contains:
            - org.elasticsearch -> *
