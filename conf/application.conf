# This is the main configuration file for the application.
# ~~~~~

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
# If you deploy your application to several instances be sure to use the same key!
application.secret="Z0NEvBLgKurae=NqdORxNYmD^PW0UO632f9`Ihn>H7p`4A<V`iH4ADGeMpN`AbED"

# The application languages
# ~~~~~
application.langs="en"

# Global object class
# ~~~~~
# Define the Global object class for this application.
# Default to Global in the root package.
# global=Global

# Database configuration
# ~~~~~ 
# You can declare as many datasources as you want.
# By convention, the default datasource is named `default`
#
# db.default.driver=org.h2.Driver
# db.default.url="jdbc:h2:mem:play"
# db.default.user=sa
# db.default.password=
#
# You can expose this datasource via JNDI if needed (Useful for JPA)
# db.default.jndiName=DefaultDS

# Evolutions
# ~~~~~
# You can disable evolutions if needed
# evolutionplugin=disabled

# Ebean configuration
# ~~~~~
# You can declare as many Ebean servers as you want.
# By convention, the default server is named `default`
#
# ebean.default="models.*"

# Logger
# ~~~~~
# You can also configure logback (http://logback.qos.ch/), by providing a logger.xml file in the conf directory .

# Root logger:
logger.root=WARN

# Logger used by the framework:
logger.play=INFO

# Logger provided to your application:
logger.application=DEBUG
logger.dispatch=DEBUG
logger.quota=DEBUG

parsers.text.maxLength=10M

hostname="http://localhost:9000"
hostname=${?HOSTNAME}
api.hostname="http://localhost:9000"
api.hostname=${?API_HOSTNAME}
oauth.hostname="https://zenobase.com"
oauth.hostname=${?OAUTH_HOSTNAME}

es.host="http://localhost:9200"
es.host=${?ES_HOST}
es.replay.host=""
es.replay.host=${?ES_REPLAY}
es.replay.parallelism=0
es.replay.parallelism=${?ES_REPLAY_PARALLELISM}
es.rebuild.host=""
es.rebuild.host=${?ES_REBUILD}
es.rebuild.parallelism=0
es.rebuild.parallelism=${?ES_REBUILD_PARALLELISM}
es.snapshot.bucket=${?ES_SNAPSHOT_BUCKET}
es.snapshot.repository=""
es.snapshot.repository=${?ES_SNAPSHOT_REPOSITORY}

mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.port=587
# mail.smtp.host=
mail.from="info@zenobase.com"
# mail.user=
# mail.pass=

assets.defaultCache="max-age=31556926"
"assets.cache./public/index.html"="max-age=0,must-revalidate"
"assets.cache./public/robots.txt"="max-age=0,must-revalidate"
"assets.cache./public/favicon.ico"="max-age=0,must-revalidate"

play.filters.headers.contentSecurityPolicy="object-src 'none'"
# play.filters.headers.contentTypeOptions=null
play.filters.headers.frameOptions="SAMEORIGIN"
play.filters.headers.permittedCrossDomainPolicies="none"
# play.filters.headers.xssProtection=null

play {
  akka {
    actor {
      default-dispatcher = {
        fork-join-executor {
          parallelism-factor = 10.0 
          parallelism-min = 10
          parallelism-max = 10
        }
      }
    }
  }
}

include "local.conf"
