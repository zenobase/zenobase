server:
    port: 9000
    max-payload-size: 10485760

web:
    hostname: "https://zenobase.com"

api:
    hostname: "https://api.zenobase.com"

auth0:
    domain: ""
    audience: ""
    jwks_domain: ""
    m2m:
        # Canonical Auth0 tenant domain (e.g. dev-xyz.us.auth0.com), required when `domain` above is a custom domain.
        domain: ""
        client_id: ""
        client_secret: ""
    # Comma-separated Auth0 client_ids that must never be deleted by `IdentityProvider.deleteApplication`. The M2M
    # client_id is always protected; list the SPA's client_id and any other first-party Auth0 Applications here so
    # they can't be removed by a buggy or compromised revoke path. DCR-minted MCP client_ids do NOT belong here.
    protected_client_ids: ""

jwt:
    secret: ""

opensearch:
    host: "http://localhost:9200"
    replay: ""
    rebuild: ""
    rebuild_parallelism: 0
    snapshot:
        bucket: ""
    snapshot_role_arn: ""

aws:
    region: ""

cors:
    allowed:
        origins:
            - "https://zenobase.com"
