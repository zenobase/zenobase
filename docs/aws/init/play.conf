description "Play"
author "Eric Jain <ejain@zenobase.com>"
version "1.0"

env USER=play
env GROUP=nogroup
env HOME=/var/play
env JAVA_OPTS="-Dconfig.file=/etc/play.conf -server"

start on runlevel [2345]
stop on runlevel [016]

respawn
expect daemon

pre-start script
  rm -f ${HOME}/RUNNING_PID
end script

exec start-stop-daemon \
  --pidfile ${HOME}/RUNNING_PID --chuid $USER:$GROUP \
  --exec ${HOME}/start --background --start \
  -- $JAVA_OPTS > /dev/null 2>&1
