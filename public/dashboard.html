<div class="container-fluid" ng:controller="BucketCtrl">

	<div class="row-fluid" style="margin-bottom: 9px;">
		<h3 class="pull-left">{{bucket.label}}</h3>
		<p class="pull-left" style="margin-left: 9px; margin-top: 5px; vertical-align: middle">
			<span class="badge" title="Events" ng:class="bucket.total && 'badge-success' || 'badge-error'">{{bucket.total}}</span>
		</p>
		<p class="pull-left" style="margin-left: 8px; margin-top: 6px; vertical-align: middle">
			<a ng:click="refresh()" title="Refresh"><i class="icon-refresh"></i></a>
		</p>
		<p class="pull-left" style="margin-left: 8px; margin-top: 6px; vertical-align: middle">
			<a data-toggle="modal" href="#create-event-dialog"><i class="icon-plus" title="Add Event"></i></a>
		</p>
		<ul class="nav nav-pills" style="clear: both; margin-bottom:12px;" ng:show="filters">
			<li class="active" ng:repeat="filter in filters">
				<a ng:click="removeFilter(filter)"><i class="icon-white" ng:class="getFilterIcon(filter)"></i> {{filter.value}} <i class="icon-remove icon-white"></i></a>
			</li>
		</ul>
	</div>

	<div class="row-fluid">
		<div class="span12">
			<ul class="nav nav-tabs">
				<li ng:class="$index == 0 && 'active'" ng:repeat="tab in getWidgets('top')">
					<a href="#{{tab.id}}" data-toggle="tab">{{tab.label}} <span class="close">&times;</span></a>
				</li>
			</ul>
			<div class="tab-content">
				<div id="{{tab.id}}" class="tab-pane active" ng:repeat="tab in getWidgets('top')">
					<ng:include src="tab.template"/>
				</div>
			</div>
		</div>
	</div>

	<div class="row-fluid">
		<div class="span6">
			<ul class="nav nav-tabs">
				<li ng:class="$index == 0 && 'active'" ng:repeat="tab in getWidgets('left')">
					<a href="#{{tab.id}}" data-toggle="tab">{{tab.label}} <span class="close">&times;</span></a>
				</li>
			</ul>
			<div class="tab-content">
				<div id="{{tab.id}}" class="tab-pane active" ng:repeat="tab in getWidgets('left')">
					<ng:include src="tab.template"/>
				</div>
			</div>
		</div>
		<div class="span6">
			<ul class="nav nav-tabs">
				<li ng:class="$index == 0 && 'active'" ng:repeat="tab in getWidgets('right')">
					<a href="#{{tab.id}}" data-toggle="tab">{{tab.label}} <span class="close">&times;</span></a>
				</li>
			</ul>
			<div class="tab-content">
				<div id="{{tab.id}}" class="tab-pane active" ng:repeat="tab in getWidgets('right')">
					<ng:include src="tab.template"/>
				</div>
			</div>
		</div>
	</div>

	<div id="create-event-dialog" class="modal hide" ng:controller="TemplateCtrl">
		<form name="createEventForm" ng:submit="create()">
			<div class="modal-header">
				<a class="close" data-dismiss="modal">&times;</a>
				<h3>Add Event</h3>
			</div>
			<div class="modal-body">
				<label for="template">Template</label>
				<div class="input">
					<select name="template" ng:model="i" ng:change="content = getTemplate(i)">
						<option value="0"></option>
						<option value="1">Lunch</option>
						<option value="2">Sleep</option>
						<option value="3">Movie</option>
						<option value="4">Hike</option>
						<option value="5">(Random)</option>
					</select>
				</div>
				<fieldset class="control-group">
					<label for="label">Content</label>
					<div class="input">
						<textarea id="event-label-field" rows="10" class="span4" required ng:model="content" ng:model-instant></textarea>
					</div>
				</fieldset>
			</div>
			<div class="modal-footer">
				<button type="submit" class="btn btn-primary" ng:disabled="{{!createEventForm.$valid}}">Create</button>
				<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>
	<script type="text/javascript">
		$('#create-event-dialog').on('shown', function () {
			$('#event-label-field').select();
		})
	</script>
</div>
