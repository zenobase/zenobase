<div class="container-fluid" ng:controller="BucketCtrl">

	<h3>{{bucket.label}} <small><a ng:click="reload()" title="Refresh"><i class="icon-refresh"></i></a></small></h3>

	<ul class="nav nav-pills" style="margin-bottom:9px;margin-top:9px">
		<li class="active" ng:repeat="filter in filters">
			<a ng:click="removeFilter(filter)">{{filter.toString()}} <i class="icon-remove"></i></a>
		</li>
	</ul>

	<div class="row-fluid">
		<div class="span12">
			<ul class="nav nav-tabs">
				<li class="active">
					<a href="#widget-timeline" data-toggle="tab">Timeline <span class="close">&times;</span></a>
				</li>
			</ul>
			<div class="tab-content">
				<div id="widget-timeline" ng:controller="TimelineCtrl" class="tab-pane active">
					<ng:include src="'public/dashboard/timeline.html'"/>
				</div>
			</div>
		</div>
	</div>

	<div class="row-fluid">
		<div class="span6">
			<ul class="nav nav-tabs">
				<li ng:repeat="tab in tabs" ng:class="$index == 0 && 'active'">
					<a href="#{{tab.id}}" data-toggle="tab">{{tab.label}} <span class="close">&times;</span></a>
				</li>
			</ul>
			<div class="tab-content">
				<div id="widget-event-list" ng:controller="EventListCtrl" class="tab-pane active">
					<ng:include src="'public/dashboard/list.html'"/>
				</div>
				<div id="widget-tag-count" ng:controller="TagCountCtrl" class="tab-pane">
					<ng:include src="'public/dashboard/count.html'"/>
				</div>
				<div id="widget-tag-gantt" ng:controller="TagGanttCtrl" class="tab-pane">
					<ng:include src="'public/dashboard/gantt.html'"/>
				</div>
				<div id="widget-rating-count" ng:controller="RatingCountCtrl" class="tab-pane">
					<ng:include src="'public/dashboard/histogram.html'"/>
				</div>
				<div class="tab-pane" id="widget-scoreboard" ng:controller="ScoreboardCtrl">
					<ng:include src="'public/dashboard/scoreboard.html'"/>
				</div>
			</div>
		</div>
		<div class="span6">
			<ul class="nav nav-tabs">
				<li class="active">
					<a href="#widget-map" data-toggle="tab">Map <span class="close">&times;</span></a>
				</li>
			</ul>
			<div class="tab-content">
				<div id="widget-map" ng:controller="MapCtrl" class="tab-pane active">
					<ng:include src="'public/dashboard/map.html'"/>
				</div>
			</div>
		</div>
	</div>

	<div id="create-event-dialog" class="modal hide" ng:controller="TemplateCtrl">
		<form name="createEventForm" ng:submit="create()">
			<div class="modal-header">
				<a class="close" data-dismiss="modal">&times;</a>
				<h3>Create Event</h3>
			</div>
			<div class="modal-body">
				<label for="template">Template</label>
				<div class="input">
					<select name="template" ng:model="i" ng:change="content = getTemplate(i)">
						<option value="0"></option>
						<option value="1">Lunch</option>
						<option value="2">Sleep</option>
						<option value="3">Movie</option>
						<option value="4">Hike</option>
						<option value="5">(Random)</option>
					</select>
				</div>
				<fieldset class="control-group">
					<label for="label">Content</label>
					<div class="input">
						<textarea id="event-label-field" rows="10" class="span10" required ng:model="content"></textarea>
					</div>
				</fieldset>
			</div>
			<div class="modal-footer">
				<button type="submit" class="btn btn-primary" ng:disabled="{{!createEventForm.$valid}}">Create</button>
				<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>
	<script type="text/javascript">
		$('#create-event-dialog').on('shown', function () {
			$('#event-label-field').select();
		})
	</script>
</div>
