<div class="container-fluid" ng:controller="UserCtrl">

	<h3 style="margin-bottom: 0.5em">
		<i class="icon-user middle"></i> {{userId}} 
		<a ng:click="reload()" title="Refresh"><i class="icon-refresh"></i></a>
		<a ng:click="broadcast('edit:user')" title="Edit" ng:show="editable()"><i class="icon-pencil"></i></a>
		<a data-toggle="modal" href="#create-bucket-dialog" ng:show="editable()"><i class="icon-plus" title="Add Bucket"></i></a>
	</h3>

	<div id="user-edit-dialog" class="alert alert-block alert-info" ng:controller="UserFormCtrl" ng:show="editing">
		<a class="close" ng:click="cancel()">&times;</a>
		<h3 class="alert-heading">Edit</h3>
		<form class="form-horizontal" name="userForm">
			<fieldset>
				<div class="control-group">
					<label class="control-label" for="edit-email">Email</label>
					<div class="controls">
						<input type="email" class="input-large" required ng:model="email" ng:model-instant>
						<p class="help-block">For important, account-related messages.</p>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="edit-password">Password</label>
					<div class="controls">
						<input type="password" class="input-large" ng:model="password" ng:model-instant>
						<p class="help-block">Leave blank to keep your current password.</p>
					</div>
				</div>
			</fieldset>
		</form>
		<p>
			<a ng:click="save()" class="btn btn-primary">Save</a>
			<a ng:click="cancel()" class="btn">Cancel</a>
			<a ng:click="close()" class="btn btn-danger pull-right"><i class="icon-trash icon-white"></i> Close Account</a>
		</p>
	</div>

	<div class="row-fluid" ng:controller="BucketListCtrl">
		<div class="">
			<table class="table">
				<thead>
					<tr>
						<th style="width: 100%">Bucket</th>
						<th style="width: 0px; text-align: right">Size</th>
						<th style="width: 0px"></th>
					</tr>
				</thead>
				<tbody>
					<tr ng:repeat="bucket in buckets">
						<td><a href="#/buckets/{{bucket['@id']}}/">{{bucket.label}}</a></td>
						<td style="text-align: right">{{bucket.size}}</td>
						<td style="text-align: right">
							<a class="action" ng:click="remove(bucket['@id'])"><i class="icon-trash" title="Delete"></i></a>
						</td>
					</tr>
					<tr ng:hide="buckets">
						<td colspan="2"><i>None</i></td>
					</tr>
				</tbody>
			</table>
			<div class="btn-toolbar">
				<div class="btn-group pull-right" ng:show="buckets">
					<button class="btn" title="Previous" ng:click="prev()" ng:disabled="{{!hasPrev()}}"><i class="icon-chevron-left"></i></button>
					<button class="btn" title="Next" ng:click="next()" ng:disabled="{{!hasNext()}}"><i class="icon-chevron-right"></i></button>
				</div>
				<div class="btn-group pull-right" ng:show="buckets">
					<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + buckets.length}}</b> of <b>{{total}}</b></button>
				</div>
			</div>
			<div id="create-bucket-dialog" class="modal hide" ng:controller="CreateBucketDialogCtrl">
				<form name="createBucketForm" ng:submit="create()">
						<div class="modal-header">
							<a class="close" data-dismiss="modal">&times;</a>
							<h3>Add Bucket</h3>
						</div>
						<div class="modal-body">
							<div class="control-group" ng:class="createBucketForm.label.$valid && 'success' || 'error'">
								<label for="template">Label</label>
								<input id="bucket-label-field" name="label" type="text" class="xlarge" required ng:minlength="1" ng:maxlength="20" ng:pattern="/^[a-zA-Z0-9-_ ]+$/" ng:model="label" ng:model-instant/>
							</div>
						</div>
						<div class="modal-footer">
							<button type="submit" class="btn btn-primary" ng:disabled="{{!createBucketForm.$valid}}">Create</button>
							<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
						</div>
				</form>
			</div>
			<script type="text/javascript">
				$('#create-bucket-dialog').on('shown', function () {
					$('#bucket-label-field').select();
				})
			</script>
		</div>
	</div>

</div>
