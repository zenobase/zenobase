<div class="container-fluid">

	<div class="row-fluid" style="margin-bottom: 9px;">
		<h3 class="pull-left">Admin</h3>
		<p class="pull-left" style="margin-left: 8px; margin-top: 6px; vertical-align: middle">
			<a ng-click="reload()" title="Refresh"><i class="icon-refresh"></i></a>
		</p>
	</div>

	<div class="row-fluid">
	
		<div class="span4">
			<div id="widget-history" ng-controller="HistoryAdminCtrl" class="tab-pane active">
				<table class="table">
					<thead>
						<tr>
							<th>Latest</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr ng-repeat="command in commands">
							<td>
								<a href="/users/?identity={{command.identity}}">{{command.identity | username}}</a>
								<span ng-bind-html="command.label"></span>
								<abbr title="{{command.timestamp}}">{{command.timestamp | age}}</abbr>
							</td>
							<td style="text-align: right">
								<a class="action" ng-click="undo(command.id)"><i class="icon-step-backward" title="Undo"></i></a>
							</td>
						</tr>
						<tr ng-hide="commands">
							<td colspan="2"><i>None</i></td>
						</tr>
					</tbody>
				</table>
				<div class="btn-toolbar">
					<div class="btn-group pull-right" ng-show="commands">
						<button class="btn" title="Previous" ng-click="prev()" ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
						<button class="btn" title="Next" ng-click="next()" ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
					</div>
					<div class="btn-group pull-right" ng-show="commands">
						<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + commands.length}}</b> of <b>{{total}}</b></button>
					</div>
				</div>
			</div>
		</div>
	
		<div class="span4">
			<div id="widget-buckets" ng-controller="BucketListAdminCtrl" class="tab-pane active">
				<table class="table">
					<thead>
						<tr>
							<th>Bucket</th>
							<th>Owner</th>
							<th style="text-align: right">Size</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr ng-repeat="bucket in buckets">
							<td><a href="/buckets/{{bucket['@id']}}/">{{bucket.label}}</a></td>
							<td><a href="/users/?identity={{getOwner(bucket)}}">{{getOwner(bucket) | username}}</a></td>
							<td style="text-align: right">{{bucket.size}}</td>
							<td style="text-align: right">
								<a class="action" ng-click="remove(bucket['@id'])"><i class="icon-trash" title="Delete"></i></a>
							</td>
						</tr>
						<tr ng-hide="buckets">
							<td colspan="4"><i>None</i></td>
						</tr>
					</tbody>
				</table>
				<div class="btn-toolbar">
					<div class="btn-group pull-left" ng-show="buckets">
						<a class="btn" href="/buckets/" title="Download"><i class="icon-download-alt"></i></a>
					</div>
					<div class="btn-group pull-right" ng-show="buckets">
						<button class="btn" title="Previous" ng-click="prev()" ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
						<button class="btn" title="Next" ng-click="next()" ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
					</div>
					<div class="btn-group pull-right" ng-show="buckets">
						<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + buckets.length}}</b> of <b>{{total}}</b></button>
					</div>
				</div>
			</div>
		</div>
	
		<div class="span4">
			<div id="widget-users" ng-controller="UserListAdminCtrl" class="tab-pane active">
				<table class="table">
					<thead>
						<tr>
							<th>User</th>
							<th>Signed up</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr ng-repeat="user in users">
							<td>
								<a href="/users/{{user.name}}" ng-show="!user.suspended" ng-class="user.superuser && 'b'">{{user.name}}</a>
								<span style="color:gray" ng-show="user.suspended">{{user.name}}</span>
							</td>
							<td>{{user.created | age}}</td>
							<td style="text-align: right">
								<a class="action" ng-click="close(user.name)" ng-show="!user.suspended && !user.superuser"><i class="icon-ban-circle" title="Close Account"></i></a>
							</td>
						</tr>
						<tr ng-hide="users">
							<td colspan="3"><i>None</i></td>
						</tr>
					</tbody>
				</table>
				<div class="btn-toolbar">
					<div class="btn-group pull-left" ng-show="users">
						<a class="btn" href="/users/" title="Download"><i class="icon-download-alt"></i></a>
					</div>
					<div class="btn-group pull-right" ng-show="users">
						<button class="btn" title="Previous" ng-click="prev()" ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
						<button class="btn" title="Next" ng-click="next()" ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
					</div>
					<div class="btn-group pull-right" ng-show="users">
						<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + users.length}}</b> of <b>{{total}}</b></button>
					</div>
				</div>
			</div>
		</div>
	
	</div>		
</div>
