<!doctype html>
<html ng-app="ZenoAdminModule">
	<head>
		<title>Zenobase</title>
		<link rel="shortcut icon" type="image/png" href="/public/images/favicon.png"/>
		<link rel="stylesheet" type="text/css" href="/public/stylesheets/bootstrap-2.0.2.css"/>
		<link rel="stylesheet" type="text/css" href="/public/stylesheets/zeno.css"/>
		<link rel="stylesheet" type="text/css" href="/public/stylesheets/bootstrap-responsive-2.0.2.css"/>
		<script src="/public/javascripts/jquery-1.7.2.js"></script>
		<script src="/public/javascripts/bootstrap-modal-2.0.2.js"></script>
		<script src="/public/javascripts/bootstrap-dropdown-2.0.2.js"></script>
		<script src="/public/javascripts/bootstrap-tab-2.0.2.js"></script>
		<script src="/public/javascripts/angular-1.0.0rc5.js"></script>
		<script src="/public/javascripts/angular-sanitize-1.0.0rc5.js"></script>
		<script src="/public/javascripts/iso8601.js"></script>
		<script src="/public/javascripts/humane.js"></script>
		<script src="//www.google.com/jsapi"></script>
		<script src="/public/javascripts/zeno.js"></script>
		<script src="/public/javascripts/zeno-admin.js"></script>
	</head>

	<body ng-controller="MainCtrl" class="ng-cloak">

		<header class="container-fluid">
			<p class="logo pull-left"><a href="#/"><img src="/public/img/logo.png" alt="ZenoBase"/></a></p>
			<div class="pull-right">
				<p ng-show="user.name">
					<i class="icon-user"></i> <a href="#/users/{{user.getName()}}">{{user.getName()}}</a> | <a ng-click="signOut()">Sign out</a>
				</p>
				<p ng-hide="user">
					<a href="#sign-in-dialog" data-toggle="modal">Sign in</a>
				</p>
			</div>
		</header>

		<div ng-view></div>

		<footer class="container-fluid">
			<p zeno-copyright start="2012" author="Zenobase LLC"/>
		</footer>

	</body>

</html>
