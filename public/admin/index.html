<!doctype html>
<html lang="en">
	<head>
		<title>Zenobase Admin</title>
		<meta charset="utf-8"/>
		<meta property="version" content="39af5bd2"/>
		<meta name="viewport" content="width=device-width"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="application-name" content="Zenobase"/>
		<meta name="msapplication-TileColor" content="#ffffff"/>
		<meta name="msapplication-TileImage" content="/img/tile.png"/>
		<link rel="stylesheet" type="text/css" href="/css/zeno-cde60740.min.css"/>
		<link rel="apple-touch-icon" href="/img/icon.png"/>
	</head>

	<body id="app" data-ng-controller="ApplicationController">

		<header class="container-fluid">
			<a href="/#/"><img src="/img/logo.png" alt="Zenobase" width="159" height="25"/></a>
			<div class="pull-right ng-cloak">
				<p data-ng-show="user.name">
					<i class="fa fa-user"></i> <a data-ng-href="/#/users/{{user.getName()}}">{{user.getName()}}</a> | <a id="sign-out-link" data-ng-click="signOut()">Sign out</a>
				</p>
				<p data-ng-hide="user">
					<a id="sign-in-link" data-ng-click="openDialog('sign-in-dialog')">Sign in</a>
				</p>
			</div>
		</header>

		<div data-ng-view>
			<div class="container-fluid" style="margin-top: 14px">
				Loading...
			</div>
		</div>

		<footer class="container-fluid">
			&copy; <span data-ui-current-year></span> Zenobase LLC
		</footer>

		<script src="/js/LAB-2.0.3.min.js"></script>
		<script>
			$LAB
				.script(function() {
					window._gaq = [];
				})
				.script("/js/jquery-2.0.3.min.js")
				.script("/js/moment-2.4.0.min.js").wait()
				.script("/js/bootstrap-custom-2.3.2.min.js")
				.script("/js/highcharts-custom-3.0.7.min.js")
				.script("/js/angular-custom-1.2.6.min.js").wait()
				.script("/js/zeno-39af5bd2.min.js").wait()
				.script("/admin/js/zeno-c5d0b717.js").wait(function() {
					angular.bootstrap(document.documentElement, ['ZenoAdminModule']);
				});
		</script>

	</body>

</html>
