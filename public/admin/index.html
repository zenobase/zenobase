<!doctype html>
<html>
	<head>
		<title>Zenobase</title>
		<meta charset="utf-8"/>
		<link rel="shortcut icon" type="image/png" href="/public/img/favicon.ico"/>
		<link rel="stylesheet" type="text/css" href="/public/css/zeno.min.css"/>
	</head>

	<body data-ng-controller="MainCtrl">

		<header class="container-fluid">
			<p class="logo pull-left"><a href="#/"><img src="/public/img/logo.png" alt="ZenoBase"/></a></p>
			<div class="pull-right ng-cloak">
				<p data-ng-show="user.name">
					<i class="icon-user"></i> <a href="#/users/{{user.getName()}}">{{user.getName()}}</a> | <a data-ng-click="signOut()">Sign out</a>
				</p>
				<p data-ng-hide="user">
					<a href="#sign-in-dialog" data-toggle="modal">Sign in</a>
				</p>
			</div>
		</header>

		<div data-ng-view>
			<div class="container-fluid">
				<i class="icon-refresh"></i> Loading...
			</div>
		</div>

		<footer class="container-fluid">
			&copy; <span data-copyright-year="2012"></span> Zenobase LLC
		</footer>

		<script src="/public/js/LAB-2.0.3.min.js"></script>
		<script>
			$LAB
				.script("/public/js/jquery-1.7.2.min.js").wait()
				.script("/public/js/bootstrap-modal-tab-2.0.3.min.js")
				.script("/public/js/angular-1.0.0rc6.min.js").wait()
				.script("/public/js/angular-sanitize-1.0.0rc6.min.js")
				.script("/public/js/iso8601.js")
				.script("/public/js/humane.js")
				.script("//www.google.com/jsapi").wait()
				.script("/public/js/zeno.js").wait()
				.script("/public/js/zeno-admin.js").wait(function() {
					angular.bootstrap(document, ['ZenoAdminModule']);
				});
		</script>

	</body>

</html>
