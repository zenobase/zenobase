<!doctype html>
<html>
	<head>
		<title>Zenobase Admin</title>
		<meta charset="utf-8"/>
		<meta property="version" content="29af5b86"/>
		<meta name="viewport" content="width=device-width"/>
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		<link rel="stylesheet" type="text/css" href="/css/zeno-bde60718.min.css"/>
	</head>

	<body data-ng-controller="MainCtrl">

		<header class="container-fluid">
			<p class="logo pull-left"><a href="#/"><img src="/img/logo.png" alt="Zenobase" width="159" height="25"/></a></p>
			<div class="pull-right ng-cloak">
				<p data-ng-show="user.name">
					<i class="icon-user"></i> <a data-ng-href="#/users/{{user.getName()}}">{{user.getName()}}</a> | <a href="javascript:" data-ng-click="signOut()">Sign out</a>
				</p>
				<p data-ng-hide="user">
					<a href="#sign-in-dialog" data-toggle="modal">Sign in</a>
				</p>
			</div>
		</header>

		<div data-ng-view>
			<div class="container-fluid">
				<i class="icon-refresh"></i> Loading...
			</div>
		</div>

		<footer class="container-fluid">
			&copy; <span data-copyright-year="2012"></span> Zenobase LLC
		</footer>

		<script src="/js/LAB-2.0.3.js"></script>
		<script>
			$LAB
				.script(function() {
					window._gaq = [];
				})
				.script("/js/jquery-1.7.2.js").wait()
				.script("/js/bootstrap-2.0.4-3df509e5.js")
				.script("/js/angular-1.0.1.js").wait()
				.script("/js/angular-sanitize-1.0.1.js")
				.script("/js/json3-3.2.3.js")
				.script("/js/iso8601-f660e6f1.js")
				.script("/js/humane-db64b4de.js")
				.script("//www.google.com/jsapi").wait()
				.script("/js/zeno-29af5b86.js").wait()
				.script("/admin/js/zeno-c5d0b692.js").wait(function() {
					angular.bootstrap(document, ['ZenoAdminModule']);
				});
		</script>

	</body>

</html>
