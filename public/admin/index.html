<!doctype html>
<html data-ng-app="ZenoAdminModule">
	<head>
		<title>Zenobase</title>
		<meta charset="utf-8"/>
		<link rel="shortcut icon" type="image/png" href="/public/img/favicon.png"/>
		<link rel="stylesheet" type="text/css" href="/public/css/bootstrap-2.0.3.css"/>
		<link rel="stylesheet" type="text/css" href="/public/css/bootstrap-responsive-2.0.3.css"/>
		<link rel="stylesheet" type="text/css" href="/public/css/zeno.css"/>
		<script src="/public/js/jquery-1.7.2.js"></script>
		<script src="/public/js/bootstrap-modal-2.0.3.js"></script>
		<script src="/public/js/bootstrap-tab-2.0.3.js"></script>
		<script src="/public/js/angular-1.0.0rc6.js"></script>
		<script src="/public/js/angular-sanitize-1.0.0rc6.js"></script>
		<script src="/public/js/iso8601.js"></script>
		<script src="/public/js/humane.js"></script>
		<script src="//www.google.com/jsapi"></script>
		<script src="/public/js/zeno.js"></script>
		<script src="/public/js/zeno-admin.js"></script>
	</head>

	<body data-ng-controller="MainCtrl">

		<header class="container-fluid">
			<p class="logo pull-left"><a href="#/"><img src="/public/img/logo.png" alt="ZenoBase"/></a></p>
			<div class="pull-right ng-cloak">
				<p data-ng-show="user.name">
					<i class="icon-user"></i> <a href="#/users/{{user.getName()}}">{{user.getName()}}</a> | <a data-ng-click="signOut()">Sign out</a>
				</p>
				<p data-ng-hide="user">
					<a href="#sign-in-dialog" data-toggle="modal">Sign in</a>
				</p>
			</div>
		</header>

		<div data-ng-view>
			<div class="container-fluid">
				<div class="alert alert-block alert-error">
					Couldn't load site.
				</div>
			</div>
		</div>

		<footer class="container-fluid">
			&copy; <span data-copyright-year="2012"></span> Zenobase LLC
		</footer>

	</body>

</html>
