<!doctype html>
<html>
	<head>
		<title>Zenobase Admin</title>
		<meta charset="utf-8"/>
		<meta property="version" content="29af5ba5"/>
		<meta name="viewport" content="width=device-width"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<link rel="stylesheet" type="text/css" href="/css/zeno-bde60723.min.css"/>
		<!--[if lt IE 9]>
		<script src="/js/html5shiv-3.6.1.min.js"></script>
		<![endif]-->
	</head>

	<body data-ng-controller="ApplicationController">

		<header class="container-fluid">
			<a href="/#/"><img src="/img/logo.png" alt="Zenobase" width="159" height="25"/></a>
			<div class="pull-right ng-cloak">
				<p data-ng-show="user.name">
					<i class="icon-user"></i> <a data-ng-href="#/users/{{user.getName()}}">{{user.getName()}}</a> | <a id="sign-out-link" data-ng-click="signOut()">Sign out</a>
				</p>
				<p data-ng-hide="user">
					<a id="sign-in-link" data-ng-click="openDialog('sign-in-dialog')">Sign in</a>
				</p>
			</div>
		</header>

		<div data-ng-view>
			<div class="container-fluid">
				<i class="icon-refresh"></i> Loading...
			</div>
		</div>

		<footer class="container-fluid">
			&copy; <span data-ui-copyright-year="2012"></span> Zenobase LLC
		</footer>

		<script src="/js/LAB-2.0.3.min.js"></script>
		<script>
			$LAB
				.script(function() {
					window._gaq = [];
				})
				.script("/js/jquery-1.8.3.min.js").wait()
				.script("/js/jquery-timeentry-1.4.9.min.js")
				.script("/js/moment-1.7.2.min.js")
				.script("/js/bootstrap-2.2.2.min.js").wait()
				.script("/js/angular-1.0.3.min.js").wait()
				.script("/js/angular-sanitize-1.0.3.min.js")
				.script("/js/json3-3.2.3.min.js")
				.script("/js/zeno-29af5ba5.min.js").wait()
				.script("/admin/js/zeno-c5d0b697.js").wait(function() {
					angular.bootstrap(document, ['ZenoAdminModule']);
				});
		</script>

	</body>

</html>
