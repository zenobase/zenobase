<div class="container-fluid">

	<div class="row-fluid" style="margin-bottom: 9px;">
		<h3 class="pull-left">Admin</h3>
		<p class="pull-left" style="margin-left: 8px; margin-top: 6px; vertical-align: middle">
			<a data-ng-click="reload()" title="Refresh" data-tooltip><i class="icon-refresh"></i></a>
		</p>
	</div>

	<div class="row-fluid">
	
		<div class="span4">
			<div id="widget-history" data-ng-controller="HistoryAdminCtrl" class="tab-pane active">
				<table class="table">
					<thead>
						<tr>
							<th>Latest</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr data-ng-repeat="command in commands">
							<td>
								<a href="/users/?identity={{command.principal}}">{{command.principal | username}}</a>
								<span data-ng-bind-html="command.label"></span>
								<abbr title="{{command.timestamp}}">{{command.timestamp | age}}</abbr>
							</td>
							<td style="text-align: right">
								<a class="action" data-ng-click="undo(command['@id'])" title="Undo" data-tooltip><i class="icon-step-backward"></i></a>
							</td>
						</tr>
						<tr data-ng-show="commands == null">
							<td colspan="2"><i>Loading</i></td>
						</tr>
						<tr data-ng-show="commands.length == 0">
							<td colspan="2"><i>None</i></td>
						</tr>
					</tbody>
				</table>

				<div class="btn-toolbar">
					<div class="btn-group pull-right" data-ng-show="commands">
						<button class="btn" title="Previous" data-tooltip data-ng-click="prev()" data-ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
						<button class="btn" title="Next" data-tooltip data-ng-click="next()" data-ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
					</div>
					<div class="btn-group pull-right" data-ng-show="commands">
						<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + commands.length}}</b> of <b>{{total}}</b></button>
					</div>
				</div>
			</div>
		</div>
	
		<div class="span4">
			<div id="widget-buckets" data-ng-controller="BucketListAdminCtrl" class="tab-pane active">
				<table class="table">
					<thead>
						<tr>
							<th>Bucket</th>
							<th>Owner</th>
							<th style="text-align: right">Size</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr data-ng-repeat="bucket in buckets">
							<td>
								<a data-ng-show="isPublished(bucket)" data-ng-href="/#/buckets/{{bucket['@id']}}">{{bucket.label}}</a>
								<span data-ng-hide="isPublished(bucket)">{{bucket.label}}</span>
							</td>
							<td><a href="/users/?identity={{getOwner(bucket)}}">{{getOwner(bucket) | username}}</a></td>
							<td style="text-align: right">{{bucket.size}}</td>
							<td style="text-align: right">
								<a class="action" data-ng-click="remove(bucket['@id'])" title="Delete" data-tooltip><i class="icon-trash"></i></a>
							</td>
						</tr>
						<tr data-ng-show="buckets == null">
							<td colspan="4"><i>Loading</i></td>
						</tr>
						<tr data-ng-show="buckets.length == 0">
							<td colspan="4"><i>None</i></td>
						</tr>
					</tbody>
				</table>
				<div class="btn-toolbar">
					<div class="btn-group pull-left" data-ng-show="buckets">
						<a class="btn" href="/buckets/" title="Download" data-tooltip><i class="icon-download-alt"></i></a>
					</div>
					<div class="btn-group pull-right" data-ng-show="buckets">
						<button class="btn" title="Previous" data-tooltip data-ng-click="prev()" data-ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
						<button class="btn" title="Next" data-tooltip data-ng-click="next()" data-ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
					</div>
					<div class="btn-group pull-right" data-ng-show="buckets">
						<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + buckets.length}}</b> of <b>{{total}}</b></button>
					</div>
				</div>
			</div>
		</div>
	
		<div class="span4">
			<div id="widget-users" data-ng-controller="UserListAdminCtrl" class="tab-pane active">
				<table class="table">
					<thead>
						<tr>
							<th>User</th>
							<th>Signed up</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr data-ng-repeat="user in users">
							<td>
								<a href="/users/{{user.name}}" data-ng-show="!user.suspended" data-ng-class="user.superuser && 'b'">{{user.name}}</a>
								<span style="color:gray" data-ng-show="user.suspended">{{user.name}}</span>
							</td>
							<td>{{user.created | age}}</td>
							<td style="text-align: right">
								<a class="action" data-ng-click="close(user.name)" data-ng-show="!user.suspended && !user.superuser" title="Close Account" data-tooltip><i class="icon-ban-circle"></i></a>
							</td>
						</tr>
						<tr data-ng-show="users == null">
							<td colspan="3"><i>Loading</i></td>
						</tr>
						<tr data-ng-show="users.length == 0">
							<td colspan="3"><i>None</i></td>
						</tr>
					</tbody>
				</table>
				<div class="btn-toolbar">
					<div class="btn-group pull-left" data-ng-show="users">
						<a class="btn" href="/users/" title="Download" data-tooltip><i class="icon-download-alt"></i></a>
					</div>
					<div class="btn-group pull-right" data-ng-show="users">
						<button class="btn" title="Previous" data-tooltip data-ng-click="prev()" data-ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
						<button class="btn" title="Next" data-tooltip data-ng-click="next()" data-ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
					</div>
					<div class="btn-group pull-right" data-ng-show="users">
						<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + users.length}}</b> of <b>{{total}}</b></button>
					</div>
				</div>
			</div>
		</div>
	
	</div>		
</div>
