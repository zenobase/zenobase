<div class="container-fluid">

	<h3>Home <a ng:click="reload()" title="Refresh"><i class="icon-refresh"></i></a></h3>

	<div class="row-fluid">
		<div class="span6" ng:controller="BucketListCtrl">
			<table class="table">
				<thead>
					<tr>
						<th>Bucket</th>
						<th style="text-align: right">Events</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr ng:repeat="bucket in buckets">
						<td><a href="#/buckets/{{bucket['@id']}}/">{{bucket.label}}</a></td>
						<td style="text-align: right">{{bucket.size}}</td>
						<td style="text-align: right">
							<a class="action" ng:click="remove(bucket['@id'])"><i class="icon-trash" title="Delete"></i></a>
						</td>
					</tr>
					<tr ng:hide="buckets">
						<td colspan="2"><i>None</i></td>
					</tr>
				</tbody>
			</table>
			<div class="btn-toolbar">
				<div class="btn-group">
					<button class="btn" data-toggle="modal" href="#create-bucket-dialog"><i class="icon-plus" title="Create"></i></button>
				</div>
				<div class="btn-group pull-right" ng:show="buckets">
					<button class="btn" title="Previous" ng:click="prev()" ng:disabled="{{!hasPrev()}}"><i class="icon-chevron-left"></i></button>
					<button class="btn" title="Next" ng:click="next()" ng:disabled="{{!hasNext()}}"><i class="icon-chevron-right"></i></button>
				</div>
				<div class="btn-group pull-right" ng:show="buckets">
					<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + buckets.length}}</b> of <b>{{total}}</b></button>
				</div>
			</div>
			<div id="create-bucket-dialog" class="modal hide" ng:controller="CreateBucketDialogCtrl">
				<form name="createBucketForm" ng:submit="create()">
						<div class="modal-header">
							<a class="close" data-dismiss="modal">&times;</a>
							<h3>Create Bucket</h3>
						</div>
						<div class="modal-body">
							<div class="control-group" ng:class="createBucketForm.label.$valid && 'success' || 'error'">
								<label for="template">Label</label>
								<input id="bucket-label-field" name="label" type="text" class="xlarge" required ng:minlength="1" ng:maxlength="20" ng:pattern="/^[a-zA-Z0-9-_ ]+$/" ng:model="label" ng:model-instant/>
							</div>
						</div>
						<div class="modal-footer">
							<button type="submit" class="btn btn-primary" ng:disabled="{{!createBucketForm.$valid}}">Create</button>
							<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
						</div>
				</form>
			</div>
			<script type="text/javascript">
				$('#create-bucket-dialog').on('shown', function () {
					$('#bucket-label-field').select();
				})
			</script>
		</div>
	</div>

</div>
