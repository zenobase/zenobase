<div>

	<table class="table" ng:show="terms">
		<thead>
			<tr>
				<th style="text-transform: capitalize">{{termField}}</th>
				<th style="text-align: right">Count</th>
				<th style="text-align: right">Min</th>
				<th style="text-align: right">Max</th>
				<th style="text-align: right">Sum</th>
				<th style="text-align: right">Avg</th>
			</tr>
		</thead>
		<tbody>
			<tr ng:repeat="term in terms">
				<td><a ng:click="filter(term)" ng:bind-html="term.label | field:termField"></a></td>
				<td style="text-align: right" ng:bind-html="term.count | number"></td>
				<td style="text-align: right" ng:bind-html="term.min | field:valueField"></td>
				<td style="text-align: right" ng:bind-html="term.max | field:valueField"></td>
				<td style="text-align: right" ng:bind-html="term.sum | field:valueField"></td>
				<td style="text-align: right" ng:bind-html="term.avg | field:valueField"></td>
			</tr>
			<tr ng:hide="terms">
				<td colspan="6"><i>None</i></td>
			</tr>
		</tbody>
	</table>

	<p ng:hide="terms" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group">
			<a class="btn" href="#scoreboard-config-dialog" title="Configure" data-toggle="modal"><i class="icon-cog"></i></a>
		</div>
	</div>

	<div id="scoreboard-config-dialog" class="modal hide" ng:controller="ScoreboardConfigCtrl">
		<form name="scoreboardConfigForm" ng:submit="save()">
			<div class="modal-header">
				<a class="close" data-dismiss="modal">&times;</a>
				<h3>Scoreboard</h3>
			</div>
			<div class="modal-body">
				<fieldset class="control-group">
					<label for="limit">Limit</label>
					<div class="input">
						<input name="limit" type="number" required min="1" max="100" ng:model="limit" ng:model-instant/>
						<p class="help-block">The number of items to show.</p>
					</div>
				</fieldset>
				<fieldset class="control-group">
					<label for="termField">Term Field</label>
					<div class="input">
						<input name="termField" type="text" required ng:model="termField" ng:model-instant/>
						<p class="help-block">The field for which to aggregate statistics.</p>
					</div>
				</fieldset>
				<fieldset class="control-group">
					<label for="valueField">Value Field</label>
					<div class="input">
						<input name="valueField" type="text" required ng:model="valueField" ng:model-instant/>
						<p class="help-block">The numeric field on which to gather statistics.</p>
					</div>
				</fieldset>
				<fieldset class="control-group">
					<label for="unit">Unit</label>
					<div class="input">
						<input name="valueField" type="text" required ng:model="unit" ng:model-instant/>
						<p class="help-block">The unit to use.</p>
					</div>
				</fieldset>
			</div>
			<div class="modal-footer">
				<button type="submit" class="btn btn-primary" ng:disabled="{{!scoreboardConfigForm.$valid}}">Save</button>
				<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>

</div>
