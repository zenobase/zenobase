<div id="{{settings.id}}-content" data-ng-controller="MapCtrl">

	<div id="{{settings.id}}-map" style="height: 350px" data-ng-show="points"></div>

	<p data-ng-show="points == null" class="none">Loading...</p>

	<p data-ng-show="points.length == 0" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group" data-ng-show="editing">
			<button class="btn" title="Settings..." data-ng-click="showDialog(true)"><i class="icon-cog"></i> Settings...</button>
		</div>
	</div>

	<div data-ui-modal="dialogShown" data-ui-modal-close="cancel()" data-ng-controller="MapSettingsCtrl">
		<form name="form" class="modal-form">
			<div class="modal-header">
				<a class="close" href="javascript:" data-dismiss="modal">&times;</a>
				<h4>Map Widget</h4>
			</div>
			<div class="modal-body">
				<div class="control-group">
					<label class="control-label" for="label">Title</label>
					<div class="controls">
						<input name="label" type="text" required min="1" max="20" data-ng-model="settings.label"/>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="unit">Color</label>
					<div class="controls">
						<select name="color" data-ng-model="settings.markerColor" data-ng-options="color for color in getColors()"></select>
						<p class="help-block">The marker color.</p>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="factor">Factor</label>
					<div class="controls">
						<input name="factor" type="number" required min="1" max="100" data-ng-model="settings.factor"/>
						<p class="help-block">Controls how much points are clustered together: Higher values equal more clusters.</p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-primary" data-ng-click="save()" data-ng-disabled="!form.$valid">Update</button>
				<button class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>

</div>
