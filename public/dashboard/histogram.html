<div id="{{settings.id}}-content" data-ng-controller="HistogramWidgetController">

	<div id="{{settings.id}}-chart" data-ng-show="intervals"></div>

	<p data-ng-show="intervals == null" class="none">Loading...</p>

	<p data-ng-show="intervals.length == 0" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group" data-ng-show="editing">
			<button class="btn" title="Settings..." data-ng-click="openDialog(settings.id + '-dialog')"><i class="icon-cog"></i> Settings...</button>
		</div>
	</div>

	<div data-ui-modal="dialog == settings.id + '-dialog'" data-ui-modal-open="init()" data-ui-modal-close="closeDialog()" data-ng-controller="HistogramWidgetDialogController">
		<form name="form" class="modal-form">
			<div class="modal-header">
				<a class="close" data-dismiss="modal">&times;</a>
				<h4>Histogram Widget</h4>
			</div>
			<div class="modal-body">
				<div class="control-group">
					<label class="control-label" for="label">Title</label>
					<div class="controls">
						<input name="label" type="text" required min="1" max="20" data-ng-model="settings.label"/>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="field">Field</label>
					<div class="controls">
						<select name="field" required data-ng-model="settings.field" data-ng-options="field.name as field.name for field in getFields()"></select>
						<p class="help-block">The numeric field on which to gather statistics.</p>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="interval">Interval</label>
					<div class="controls">
						<input name="interval" type="number" required min="1" data-ng-model="settings.interval"/>
						<p class="help-block">The size of each interval in the histogram.</p>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="unit">Unit</label>
					<div class="controls">
						<select name="unit" data-ng-model="settings.unit" data-ng-options="unit for unit in getUnits()"></select>
						<p class="help-block">The unit to use.</p>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="filter">Filter</label>
					<div class="controls">
						<input name="filter" type="text" data-ng-model="settings.filter"/>
						<p class="help-block">Optional constraint.</p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-primary" data-ng-click="save()" data-ng-disabled="!form.$valid">Update</button>
				<button class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>

</div>
