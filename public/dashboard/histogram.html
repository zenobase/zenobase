<div ng:controller="RatingCountCtrl">

	<table class="table" ng:show="ratings">
		<thead>
			<tr>
				<th>Rating</th>
				<th style="text-align: right">Count</th>
			</tr>
		</thead>
		<tbody>
			<tr ng:repeat="rating in ratings">
				<td ng:bind-html="rating.from | stars"></td>
				<td style="text-align: right">{{rating.count | number }}</td>
			</tr>
			<tr ng:hide="ratings">
				<td colspan="2"><i>None</i></td>
			</tr>
		</tbody>
	</table>

	<p ng:hide="ratings" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group" ng:show="editing">
			<button class="btn" title="Settings" ng:click="showDialog(true)"><i class="icon-cog"></i></button>
		</div>
	</div>

	<div class="modal" ng:controller="WidgetSettingsCtrl" ng:show="dialogShown">
		<form name="form">
			<div class="modal-header">
				<a class="close" ng:click="cancel()">&times;</a>
				<h3>Ratings</h3>
			</div>
			<div class="modal-body">
				<div class="control-group">
					<label class="control-label" for="label">Title</label>
					<div class="controls">
						<input name="label" type="text" required min="1" max="20" ng:model="settings.label" ng:model-instant/>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-primary" ng:click="save()" ng:disabled="!form.$valid">Save</button>
				<button class="btn" ng:click="cancel()">Cancel</button>
			</div>
		</form>
	</div>

</div>
