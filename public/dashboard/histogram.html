<div ng:controller="RatingCountCtrl">

	<table class="table" ng:show="ratings">
		<thead>
			<tr>
				<th>Rating</th>
				<th style="text-align: right">Count</th>
			</tr>
		</thead>
		<tbody>
			<tr ng:repeat="rating in ratings">
				<td ng:bind-html="rating.from | stars"></td>
				<td style="text-align: right">{{rating.count | number }}</td>
			</tr>
			<tr ng:hide="ratings">
				<td colspan="2"><i>None</i></td>
			</tr>
		</tbody>
	</table>

	<p ng:hide="ratings" class="none">None</p>

</div>
