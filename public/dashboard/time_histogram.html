<div id="{{settings.id}}-content" data-ng-controller="TimeHistogramWidgetController">

	<div id="{{settings.id}}-chart" data-ng-show="times"></div>

	<p data-ng-show="times == null" class="none">Loading...</p>

	<p data-ng-show="times.length == 0" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group">
			<button class="btn" title="Settings..." data-ng-click="openDialog(settings.id + '-dialog')" data-ng-show="editing"><i class="icon-cog"></i> Settings...</button>
		</div>
	</div>

	<div data-ui-modal="dialog == settings.id + '-dialog'" data-ui-modal-open="init()" data-ui-modal-close="closeDialog()" data-ng-controller="TimeHistogramWidgetDialogController">
		<form name="form" class="modal-form">
			<div class="modal-header">
				<a class="close" data-dismiss="modal">&times;</a>
				<h4>Calendar Count Widget</h4>
			</div>
			<div class="modal-body">
				<div class="control-group">
					<label class="control-label" for="label">Title</label>
					<div class="controls">
						<input name="label" type="text" required min="1" max="20" data-ng-model="settings.label"/>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="interval">Interval</label>
					<div class="controls">
						<select name="interval" required data-ng-model="settings.interval" data-ng-options="interval.id as interval.label for interval in intervals"></select>
						<p class="help-block">The interval to aggregate on.</p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-primary" data-ng-click="save()" data-ng-disabled="!form.$valid">Update</button>
				<button class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>

</div>
