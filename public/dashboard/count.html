<div>
	<table class="table">
		<thead>
			<tr>
				<th>
					<a ng:click="setOrder('term')">Tag</a>
					<b ng:class="getClasses('term')"></b>
				</th>
				<th style="text-align: right">
					<a ng:click="setOrder('count')">Count</a> 
					<b ng:class="getClasses('count')"></b>
				</th>
			</tr>
		</thead>
		<tbody>
			<tr ng:repeat="tag in tags">
				<td><i class="icon-tag"></i> <a ng:click="addFilter('tag:' + tag.label)">{{tag.label}}</a></td>
				<td style="text-align: right">{{tag.count | number }}</td>
			</tr>
			<tr ng:hide="tags">
				<td colspan="2"><i>None</i></td>
			</tr>
		</tbody>
	</table>
	<div class="btn-toolbar">
		<div class="btn-group">
			<a class="btn" href="#tag-count-config-dialog" title="Configure" data-toggle="modal"><i class="icon-cog"></i></a>
		</div>
		<div class="btn-group pull-right">
			<button class="btn" title="Previous" ng:click="prev()" ng:disabled="{{!hasPrev()}}"><i class="icon-chevron-left"></i></button>
			<button class="btn" title="Next" ng:click="next()" ng:disabled="{{!hasNext()}}"><i class="icon-chevron-right"></i></button>
		</div>
		<div class="btn-group pull-right">
			<a class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + tags.length}}</b></a>
		</div>
	</div>
	<div id="tag-count-config-dialog" class="modal hide" ng:controller="TagCountConfigCtrl">
		<form name="tagCountConfigForm" ng:submit="save()">
			<div class="modal-header">
				<a class="close" data-dismiss="modal">&times;</a>
				<h3>Tag Count</h3>
			</div>
			<div class="modal-body">
				<fieldset class="control-group">
					<label for="limit">Limit</label>
					<div class="input">
						<input name="limit" type="number" required min="1" max="100" ng:model="limit"/>
						<p class="help-block">The number of tags to show.</p>
					</div>
				</fieldset>
			</div>
			<div class="modal-footer">
				<button type="submit" class="btn btn-primary" ng:disabled="{{!tagCountConfigForm.$valid}}">Save</button>
				<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>
</div>
