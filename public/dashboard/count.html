<div ng-controller="TermCountCtrl">

	<table class="table" ng-show="terms">
		<thead>
			<tr>
				<th style="text-transform: capitalize">
					<a ng-click="setOrder('term')">{{settings.field}}
					<b ng-class="getClasses('term')"></b></a>
				</th>
				<th style="text-align: right">
					<a ng-click="setOrder('count')">Count 
					<b ng-class="getClasses('count')"></b></a>
				</th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="term in terms">
				<td><a ng-click="filter(term)" ng-bind-html="term.label | field:settings.field"></a></td>
				<td style="text-align: right">{{term.count | number }}</td>
			</tr>
		</tbody>
	</table>

	<p ng-hide="terms" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group" ng-show="editing">
			<button class="btn" title="Settings" ng-click="showDialog(true)"><i class="icon-cog"></i></button>
		</div>
		<div class="btn-group pull-right" ng-show="terms">
			<button class="btn" title="Previous" ng-click="prev()" ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
			<button class="btn" title="Next" ng-click="next()" ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
		</div>
		<div class="btn-group pull-right" ng-show="terms">
			<a class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + terms.length}}</b></a>
		</div>
	</div>

	<div class="modal" ng-controller="WidgetSettingsCtrl" ng-show="dialogShown">
		<form name="form">
			<div class="modal-header">
				<a class="close" ng-click="cancel()">&times;</a>
				<h3>Term Counts</h3>
			</div>
			<div class="modal-body">
				<div class="control-group">
					<label class="control-label" for="label">Title</label>
					<div class="controls">
						<input name="label" type="text" required min="1" max="20" ng-model="settings.label"/>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="limit">Limit</label>
					<div class="controls">
						<input name="limit" type="number" required min="1" max="100" ng-model="settings.limit"/>
						<p class="help-block">The number of items to show.</p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-primary" ng-click="save()" ng-disabled="!form.$valid">Save</button>
				<button class="btn" ng-click="cancel()">Cancel</button>
			</div>
		</form>
	</div>

</div>
