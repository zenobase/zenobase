<div id="{{settings.id}}-content" data-ng-controller="CountWidgetController">

	<table class="table" data-ng-show="terms">
		<thead>
			<tr>
				<th style="text-transform: capitalize">
					<a data-ng-click="setOrder('term')" class="sort">{{settings.field}}
					<b data-ng-class="getClasses('term')"></b></a>
				</th>
				<th style="text-align: right">
					<a data-ng-click="setOrder('count')" class="sort">Count 
					<b data-ng-class="getClasses('count')"></b></a>
				</th>
			</tr>
		</thead>
		<tbody>
			<tr data-ng-repeat="term in terms">
				<td><a data-ng-click="filter(term)" data-ng-bind-html="term.label | field:settings.field"></a></td>
				<td style="text-align: right">{{term.count | number }}</td>
			</tr>
		</tbody>
	</table>

	<p data-ng-show="terms == null" class="none">Loading...</p>

	<p data-ng-show="terms.length == 0" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group" data-ng-show="editing">
			<button class="btn" title="Settings..." data-ng-click="openDialog('count-widget-dialog')"><i class="icon-cog"></i> Settings...</button>
		</div>
		<div class="btn-group pull-right" data-ng-show="terms">
			<button class="btn" title="Previous" data-ng-click="prev()" data-ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
			<button class="btn" title="Next" data-ng-click="next()" data-ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
		</div>
		<div class="btn-group pull-right" data-ng-show="terms">
			<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + terms.length}}</b></button>
		</div>
	</div>

	<div data-ui-modal="dialog == 'count-widget-dialog'" data-ui-modal-open="init()" data-ui-modal-close="closeDialog()" data-ng-controller="CountWidgetDialogController">
		<form name="form" class="modal-form">
			<div class="modal-header">
				<a class="close" data-dismiss="modal">&times;</a>
				<h4>Count Widget</h4>
			</div>
			<div class="modal-body">
				<div class="control-group">
					<label class="control-label" for="label">Title</label>
					<div class="controls">
						<input name="label" type="text" required min="1" max="20" data-ng-model="settings.label"/>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="field">Term Field</label>
					<div class="controls">
						<select required data-ng-model="settings.field" data-ng-options="field.name as field.name for field in getFields()"></select>
						<p class="help-block">The field on which to aggregate.</p>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="limit">Limit</label>
					<div class="controls">
						<input name="limit" type="number" required min="1" max="100" data-ng-model="settings.limit"/>
						<p class="help-block">The number of items to show.</p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-primary" data-ng-click="save()" data-ng-disabled="!form.$valid">Update</button>
				<button class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>

</div>
