<div>

	<table class="table table-unbordered" ng:show="items">
		<tbody>
			<tr ng:repeat="event in items">
				<td style="line-height: 1.5">
					{{event | fields | html}}
					&nbsp;
					<div class="action pull-right">
						<a ng:click="remove(event['@id'])"><i class="icon-trash" title="Delete"></i></a>
					</div>
				</td>
			</tr>
		</tbody>
	</table>

	<p ng:hide="items" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group">
			<a class="btn" data-toggle="modal" href="#create-event-dialog"><i class="icon-plus" title="Add..."></i></a>
			<a class="btn" href="#event-list-config-dialog" title="Configure" data-toggle="modal"><i class="icon-cog"></i></a>
		</div>
		<div class="btn-group pull-right" ng:show="items">
			<button class="btn" title="Previous" ng:click="prev()" ng:disabled="{{!hasPrev()}}"><i class="icon-chevron-left"></i></button>
			<button class="btn" title="Next" ng:click="next()" ng:disabled="{{!hasNext()}}"><i class="icon-chevron-right"></i></button>
		</div>
		<div class="btn-group pull-right" ng:show="items">
			<a class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + items.length}}</b> of <b>{{total | number }}</b></a>
		</div>
	</div>

	<div id="event-list-config-dialog" class="modal hide" ng:controller="EventListConfigCtrl">
		<form name="eventListConfigForm" ng:submit="save()">
			<div class="modal-header">
				<a class="close" data-dismiss="modal">&times;</a>
				<h3>Event List</h3>
			</div>
			<div class="modal-body">
				<fieldset class="control-group">
					<label for="limit">Limit</label>
					<div class="input">
						<input name="limit" type="number" required min="1" max="100" ng:model="limit"/>
						<p class="help-block">The number of items to show.</p>
					</div>
				</fieldset>
			</div>
			<div class="modal-footer">
				<button type="submit" class="btn btn-primary" ng:disabled="{{!eventListConfigForm.$valid}}">Save</button>
				<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>

</div>
