<div id="{{settings.id}}-content" data-ng-controller="ListWidgetController">

	<table class="table" data-ng-show="items">
		<tbody>
			<tr class="event-row" data-ng-repeat="event in items">
				<td style="line-height: 1.5; border-style: none;">
					<span data-ng-bind-html="event | fields"></span>
					&nbsp;
					<div class="action pull-right" data-ng-show="editable">
						<a class="event-edit-action" data-ng-click="editEvent(event)"><i class="icon-pencil" title="Edit"></i></a>
						<a class="event-delete-action" data-ng-click="removeEvent(event['@id'])"><i class="icon-trash" title="Delete"></i></a>
					</div>
				</td>
			</tr>
		</tbody>
	</table>

	<p data-ng-show="items == null" class="none">Loading...</p>

	<p data-ng-show="items.length == 0" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group" data-ng-show="editing">
			<button class="btn" title="Settings..." data-ng-click="openDialog('list-widget-dialog')"><i class="icon-cog"></i> Settings...</button>
		</div>
		<div class="btn-group pull-right" data-ng-show="items">
			<button class="btn" title="Previous" data-ng-click="prev()" data-ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
			<button class="btn" title="Next" data-ng-click="next()" data-ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
		</div>
		<div class="btn-group pull-right" data-ng-show="items">
			<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + items.length}}</b> of <b>{{total | number }}</b></button>
		</div>
	</div>

	<div data-ui-modal="dialog == 'list-widget-dialog'" data-ui-modal-open="init()" data-ui-modal-close="closeDialog()" data-ng-controller="WidgetDialogController">
		<form name="form" class="modal-form">
			<div class="modal-header">
				<a class="close" data-dismiss="modal">&times;</a>
				<h4>List Widget</h4>
			</div>
			<div class="modal-body">
				<div class="control-group">
					<label class="control-label" for="label">Title</label>
					<div class="controls">
						<input name="label" type="text" required min="1" max="20" data-ng-model="settings.label"/>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for="limit">Limit</label>
					<div class="controls">
						<input name="limit" type="number" required min="1" max="100" data-ng-model="settings.limit"/>
						<p class="help-block">The number of items to show.</p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-primary" data-ng-click="save()" data-ng-disabled="!form.$valid">Update</button>
				<button class="btn" data-dismiss="modal">Cancel</button>
			</div>
		</form>
	</div>

</div>
