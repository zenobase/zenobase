<div data-ng-controller="TermGanttCtrl">

	<table class="table" data-ng-show="terms">
		<thead>
			<tr>
				<th>Tag</th>
				<th style="text-align: right">Last</th>
				<th style="text-align: right">Freq</th>
			</tr>
		</thead>
		<tbody>
			<tr data-ng-repeat="term in terms">
				<td><i class="icon-tag"></i> <a href="javascript:" data-ng-click="filter(term)">{{term.label}}</a></td>
				<td style="text-align: right"><abbr title="{{term.last}}">{{term.last | age}}</abbr></td>
				<td style="text-align: right">{{term.freq  | duration}}</td>
			</tr>
		</tbody>
	</table>

	<p data-ng-show="terms == null" class="none">Loading...</p>

	<p data-ng-show="terms.length == 0" class="none">None</p>

	<div class="btn-toolbar">
		<div class="btn-group" data-ng-show="editing">
			<button class="btn" title="Settings..." data-ng-click="showDialog(true)"><i class="icon-cog"></i></button>
		</div>
	</div>

	<div class="modal" data-ng-controller="WidgetSettingsCtrl" data-ng-show="dialogShown">
		<form name="form" class="modal-form">
			<div class="modal-header">
				<a class="close" href="javascript:" data-ng-click="cancel()">&times;</a>
				<h3>Term Date Ranges</h3>
			</div>
			<div class="modal-body">
				<div class="control-group">
					<label class="control-label" for="label">Title</label>
					<div class="controls">
						<input name="label" type="text" required min="1" max="20" data-ng-model="settings.label"/>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-primary" data-ng-click="save()" data-ng-disabled="!form.$valid">Update</button>
				<button class="btn" data-ng-click="cancel()">Cancel</button>
			</div>
		</form>
	</div>

</div>
