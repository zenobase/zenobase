<div class="container-fluid" data-ng-controller="UserCtrl">

	<div data-ng-show="message" class="alert alert-block alert-error">
		{{message}}
	</div>

	<div data-ng-hide="userInfo || message">
		<i class="icon-refresh"></i> Loading...		
	</div>

	<div data-ng-show="userInfo">

		<div class="row-fluid" style="margin-bottom: 9px;">
			<p class="pull-left" style="margin-left: 8px; margin-top: 6px; vertical-align: middle">
				<i class="icon-user middle"></i>&nbsp;
			</p>
			<h3 class="pull-left">{{userId}}</h3>
			<p class="pull-left" style="margin-left: 8px; margin-top: 6px; vertical-align: middle">
				<a href="javascript:" data-ng-click="reload()" title="Refresh"><i class="icon-refresh"></i></a>
			</p>
			<p class="pull-left" style="margin-left: 8px; margin-top: 6px; vertical-align: middle" data-ng-show="editable()">
				<a href="javascript:" data-ng-click="broadcast('edit:user')" title="Edit..." data-ng-show="editable()"><i class="icon-pencil"></i></a>
			</p>
			<p class="pull-left" style="margin-left: 8px; margin-top: 6px; vertical-align: middle" data-ng-show="addable()">
				<a data-toggle="modal" href="#create-bucket-dialog" title="Add Bucket..." data-ng-show="addable()"><i class="icon-plus"></i></a>
			</p>
		</div>
	
		<div id="user-edit-dialog" class="alert alert-info" data-ng-controller="UserFormCtrl" data-ng-show="editing">
			<a class="close" href="javascript:" data-ng-click="cancel()">&times;</a>
			<h3 class="alert-heading">Edit</h3>
			<form name="userForm">
				<fieldset>
					<div class="alert alert-block alert-error" data-ng-show="message">
						{{message}}
					</div>
					<div class="control-group">
						<label class="control-label" for="edit-email"><strong>Email</strong></label>
						<div class="controls">
							<input type="text" class="input-large" required data-ng-model="email">
							<p class="help-block">For important, account-related messages.
								<strong data-ng-show="userInfo.verified">Verified.</strong>
								<strong data-ng-hide="userInfo.verified">Not verified.</strong>
							</p>
						</div>
					</div>
				</fieldset>
			</form>
			<p>
				<a href="javascript:" data-ng-click="save()" class="btn btn-primary" data-ng-disabled="!userForm.$valid">Save</a>
				<a href="javascript:" data-ng-click="cancel()" class="btn">Cancel</a>
				<a href="javascript:" data-ng-click="close()" class="btn btn-danger pull-right"><i class="icon-trash icon-white"></i> Close Account</a>
			</p>
		</div>
	
		<div class="row-fluid" data-ng-controller="BucketListCtrl">
			<div class="">
				<table class="table">
					<thead>
						<tr>
							<th style="width: 0px">Bucket</th>
							<th style="width: 100%"></th>
							<th style="width: 0px; text-align: right">Size</th>
							<th style="width: 0px"></th>
						</tr>
					</thead>
					<tbody>
						<tr data-ng-show="buckets == null">
							<td colspan="3"><i>Loading...</i></td>
						</tr>
						<tr data-ng-repeat="bucket in buckets">
							<td style="white-space: nowrap"><a data-ng-href="#/buckets/{{bucket['@id']}}/">{{bucket.label}}</a></td>
							<td>{{bucket.description}}</td>
							<td style="text-align: right">{{bucket.size}}</td>
							<td style="text-align: right">
								<a class="action" href="javascript:" data-ng-click="remove(bucket['@id'])"><i class="icon-trash" title="Delete"></i></a>
							</td>
						</tr>
						<tr data-ng-show="buckets.length == 0">
							<td colspan="3"><i>None</i></td>
						</tr>
					</tbody>
				</table>
				<div class="btn-toolbar">
					<div class="btn-group pull-right" data-ng-show="buckets">
						<button class="btn" title="Previous" data-ng-click="prev()" data-ng-disabled="!hasPrev()"><i class="icon-chevron-left"></i></button>
						<button class="btn" title="Next" data-ng-click="next()" data-ng-disabled="!hasNext()"><i class="icon-chevron-right"></i></button>
					</div>
					<div class="btn-group pull-right" data-ng-show="buckets">
						<button class="btn disabled zeno-paging"><b>{{offset + 1}}</b> &ndash; <b>{{offset + buckets.length}}</b> of <b>{{total}}</b></button>
					</div>
				</div>
				<div id="create-bucket-dialog" class="modal hide" data-ng-controller="CreateBucketDialogCtrl">
					<form name="createBucketForm" data-ng-submit="create()" class="modal-form">
						<div class="modal-header">
							<a class="close" data-dismiss="modal">&times;</a>
							<h3>Add Bucket</h3>
						</div>
						<div class="modal-body">
							<div class="alert alert-error" data-ng-show="message">
								{{message}}
							</div>
							<div class="control-group" data-ng-class="createBucketForm.label.$valid && 'success' || 'error'">
								<label for="template">Label</label>
								<input id="bucket-label-field" name="label" type="text" class="xlarge" required data-ng-minlength="1" data-ng-maxlength="20" data-ng-pattern="/^[a-zA-Z0-9-_ ]+$/" data-ng-model="label"/>
							</div>
						</div>
						<div class="modal-footer">
							<button type="submit" class="btn btn-primary" data-ng-disabled="!createBucketForm.$valid">Create</button>
							<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
						</div>
					</form>
				</div>
			</div>
		</div>

	</div>

</div>
