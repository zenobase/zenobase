<div id="oauth-view" class="container-fluid" data-ng-controller="OAuthController">
	<div id="oauth-dialog" class="modal show">
		<form name="oauthForm" novalidate data-ng-submit="submit()">
			<div class="modal-header">
				<h4>Authorization</h4>
			</div>
			<div class="modal-body">
				<div id="oauth-message" class="alert alert-error" data-ng-show="message">
					{{message}}
				</div>
				<div class="control-group">
					<label class="control-label" for="oauth-bucket">Authorize <strong>{{client | username}}</strong> to use:</label>
					<div class="controls">
						<select name="bucket" data-ng-model="bucket" data-ng-options="bucket.label for bucket in findBuckets()" required></select>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button id="oauth-allow" class="btn btn-primary" data-ng-click="allow()" data-ng-disabled="!oauthForm.$valid">Allow</button>
				<button id="oauth-deny" class="btn" data-ng-click="deny('access_denied')">Deny</button>
			</div>
		</form>
	</div>
</div>
