<!doctype html>
<html xmlns:ng="http://angularjs.org" xmlns:zeno="http://zenobase.com" ng:app="ZenoModule">
	<head>
		<title>Zenobase</title>
		<link rel="shortcut icon" type="image/png" href="/public/images/favicon.png"/>
		<link rel="stylesheet" type="text/css" href="/public/stylesheets/bootstrap-2.0.2.css"/>
		<link rel="stylesheet" type="text/css" href="/public/stylesheets/zeno.css"/>
		<link rel="stylesheet" type="text/css" href="/public/stylesheets/bootstrap-responsive-2.0.2.css"/>
		<script src="/public/javascripts/jquery-1.7.1.js" type="text/javascript"></script>
		<script src="/public/javascripts/bootstrap-modal-2.0.2.js" type="text/javascript"></script>
		<script src="/public/javascripts/bootstrap-dropdown-2.0.2.js" type="text/javascript"></script>
		<script src="/public/javascripts/bootstrap-tab-2.0.2.js" type="text/javascript"></script>
		<script src="/public/javascripts/angular-1.0.0rc2.js" type="text/javascript" ng:autobind></script>
		<script src="/public/javascripts/iso8601.js" type="text/javascript"></script>
		<script src="/public/javascripts/humane.js" type="text/javascript"></script>
		<script src="//www.google.com/jsapi" type="text/javascript"></script>
		<script src="/public/javascripts/zeno.js"></script>
	</head>

	<body ng:controller="MainCtrl">

		<div ng:show="user.getName() == 'guest'" ng:cloak>
			<div class="alert">
				Your data will be lost when you sign out or close the browser. 
				<a href="#sign-up-dialog" data-toggle="modal">Sign up</a> to save your data.
			</div>
		</div>

		<header class="container-fluid">
			<p class="logo pull-left"><a href="#/"><img src="/public/img/logo.png" alt="ZenoBase"/></a></p>
			<div class="pull-right ng-cloak" ng:cloak>
				<p ng:show="user.name">
					<i class="icon-user"></i> <a href="#/users/{{user.name}}">{{user.name}}</a> | <a ng:click="signOut()">Sign out</a>
				</p>
				<p ng:show="user && user.name == null">
					<i class="icon-user"></i> guest | <a ng:click="signOut()">Sign out</a>
				</p>
				<p ng:hide="user">
					<a href="#sign-in-dialog" data-toggle="modal">Sign in</a>
				</p>
			</div>
		</header>

		<div class="container-fluid" ng:cloak>
			<div class="alert {{alert.level}}">
				<a class="close" ng:click="alert.clear()">&times;</a>
				<span ng:bind-html="alert.message"></span>
				<span ng:show="alert.undo">
					<a ng:click="undo(alert.undo)">Undo.</a>
				</span>
			</div>
		</div>

		<div class="container-fluid" ng:show="user.suspended" ng:cloak>
			<div class="alert alert-error">
				This account has been suspended. Please contact support.
			</div>
		</div>

		<div ng:hide="user.suspended">
			<ng:view></ng:view>
		</div>

		<footer>
			<p class="container-fluid">
				<zeno:copyright start="2012" author="Zenobase LLC"/>
			</p>
		</footer>

		<div id="sign-in-dialog" class="modal hide" ng:controller="AuthFormCtrl">
			<form ng:submit="signIn()">
					<div class="modal-header">
						<a class="close" data-dismiss="modal">&times;</a>
						<h3>Sign in</h3>
					</div>
					<div class="modal-body">
						<div class="control-group">
							<label for="username">User Name</label>
							<input id="username" type="text" class="large" ng:model="username" ng:model-instant/>
						</div>
						<div class="control-group">
							<label for="password">Password</label>
							<input id="password" type="password" class="large" ng:model="password" ng:model-instant/>
						</div>
						<div class="control-group">
							<div class="controls">
								<label class="checkbox">
									<input type="checkbox" id="remember" ng:model="remember" ng:model-instant>
									Remember me
								</label>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="submit" class="btn btn-primary">Sign in</button>
						<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
					</div>
			</form>
		</div>
		<script type="text/javascript">
			$('#sign-in-dialog').on('shown', function () {
				$('#username').select();
			})
		</script>

		<div id="sign-up-dialog" class="modal hide" ng:controller="SignUpFormCtrl">
			<form name="signUpForm" ng:submit="submit()">
					<div class="modal-header">
						<a class="close" data-dismiss="modal">&times;</a>
						<h3>Sign up</h3>
					</div>
					<div class="modal-body">
						<div class="control-group" ng:class="signUpForm.username.$valid && 'success' || 'error'">
							<label for="sign-up-username">User Name</label>
							<input id="sign-up-username" name="username" type="text" class="large" required ng:minlength="4" ng:maxlength="16" ng:pattern="/^[a-z0-9]+$/" ng:model="username" ng:model-instant/>
							<span class="help-inline error" ng:show="signUpForm.username.$error.MINLENGTH">Too short</span>
							<span class="help-inline error" ng:show="signUpForm.username.$error.MAXLENGTH">Too long</span>
							<span class="help-inline error" ng:show="signUpForm.username.$error.REQUIRED">Required</span>
						</div>
						<div class="control-group" ng:class="signUpForm.password.$valid && 'success' || 'error'">
							<label for="sign-up-password">Password</label>
							<input id="sign-up-password" name="password" type="password" class="large" required ng:model="password" ng:model-instant/>
						</div>
						<div class="control-group" ng:class="signUpForm.passwordRepeat.$valid && 'success' || 'error'">
							<label for="sign-up-password-repeat">Confirm Password</label>
							<input id="sign-up-password-repeat" name="passwordRepeat" type="password" class="large" required ng:model="passwordRepeat" ng:model-instant/>
						</div>
						<div class="control-group" ng:class="signUpForm.email.$valid && 'success' || 'error'">
							<label for="sign-up-email">Email</label>
							<input id="sign-up-email" name="email" type="email" class="large" required ng:model="email" ng:model-instant/>
						</div>
					</div>
					<div class="modal-footer">
						<button type="submit" class="btn btn-primary" ng:disabled="{{!signUpForm.$valid}}">Sign up</button>
						<button type="reset" class="btn" data-dismiss="modal">Cancel</button>
					</div>
			</form>
		</div>
		<script type="text/javascript">
			$('#sign-up-dialog').on('shown', function () {
				$('#sign-up-username').select();
			})
		</script>

	</body>

</html>
