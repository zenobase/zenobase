#{extends 'main.html' /}
#{set title:'Event' /}

<div class="container-fluid">

	<h3>Event <small>${event.id}</small></h3>

	<p></p>

	<table class="table table-bordered">
		<tr>
			<th>bucket</th>
			<td><a href="@{BucketController.get(bucket.id)}">${bucket}</a></td>
		</tr>
		#{list items:map.keySet(), as:'field'}
			<tr>
				<th>${field}</th>
				<td>${map.get(field)}</td>
			</tr>
		#{/list}
	</table>

</div>
