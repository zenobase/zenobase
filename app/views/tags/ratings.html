<table class="table">
	<thead>
		<tr>
			<th>Rating</th>
			<th style="text-align: right">Count</th>
		</tr>
	</thead>
	<tbody>
		#{list items:_items.elementSet(), as:'rating'}
			<tr>
				<td><i class="icon-star"></i> ${rating}</td>
				<td style="text-align: right">${_items.count(rating)}</td>
			</tr>
		#{/list}
	</tbody>
</table>
