<!DOCTYPE html>

<html xmlns:ng="http://angularjs.org">
	<head>
		<title>#{get 'title' /}</title>
		<link rel="shortcut icon" type="image/png" href="@{'/public/images/favicon.png'}">
		<link rel="stylesheet" type="text/css" href="@{'/public/stylesheets/bootstrap-2.0.0.css'}" />
		<style>
			body {
				padding-top: 60px;
			}
			.btn-group .zeno-paging {
				background-color:white;
				border:none;
			}
		</style>
		<link rel="stylesheet" type="text/css" href="@{'/public/stylesheets/bootstrap-responsive-2.0.0.css'}" />
		<script src="@{'/public/javascripts/jquery-1.7.js'}" type="text/javascript"></script>
		<script src="@{'/public/javascripts/bootstrap-modal-2.0.0.js'}" type="text/javascript"></script>
		<script src="@{'/public/javascripts/bootstrap-dropdown-2.0.0.js'}" type="text/javascript"></script>
		<script src="http://code.angularjs.org/angular-0.9.19.min.js" type="text/javascript" ng:autobind></script>

		#{get 'moreScripts' /}
	</head>

	<body>

		<div class="navbar navbar-fixed-top">
			<div class="navbar-inner">
				<div class="container-fluid">
					<ul class="nav">
						<li><a href="/"><strong>Home</strong></a></li>
					</ul>
					<ul class="nav pull-right">
			        	#{if user} 
							<li class="dropdown">
								<a class="dropdown-toggle" data-toggle="dropdown" href="#">${user} <b class="caret"></b></a>
								<ul class="dropdown-menu">
									<li><a href="@{Secure.logout()}">Log out</a></li>
								</ul>
							</li>
			            #{/if}
			            #{else}
							<li><a href="@{Secure.login()}">Log in</a></li>
			            #{/else}
					</ul>
				</div>
			</div>
		</div>

        #{doLayout /}

		<div class="container-fluid">
			<footer>
				<p>&copy; 2012 Zenobase LLC</p>
			</footer>
		</div>

    </body>

</html>
